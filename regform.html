<!DOCTYPE html>
<html><head><title>Registration Form</title></head>
<body>

<h2>REG FORM </h2>

<form>

<input type="text">

<input type="email">
<br><br>

<input type="password">
<br><br>

<label>Gender: </label>

<input type="reset" value="Clear"><br><br>
</form>

</body>
</html>
